<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS2コントローラー 操作割当シート</title>
<style>
  :root{
    --ui-bg:#eef1f6; --ui-fg:#1b2230; --ui-card:#fff; --ui-line:#d3d9e4; --ui-accent:#2f6fed;
  }
  html[data-ui="dark"]{
    --ui-bg:#0f1116; --ui-fg:#e6e9f0; --ui-card:#191c24; --ui-line:#333a49; --ui-accent:#6ea0ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ui-bg); color:var(--ui-fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;
  }
  .bar{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px 16px; background:var(--ui-card); border-bottom:1px solid var(--ui-line);
    position:sticky; top:0; z-index:20;
  }
  .bar h1{font-size:15px; margin:0 12px 0 0; font-weight:700; letter-spacing:.02em}
  .bar .sp{flex:1}
  button{
    font:inherit; font-size:13px; padding:7px 13px; border-radius:8px; cursor:pointer;
    border:1px solid var(--ui-line); background:var(--ui-card); color:var(--ui-fg);
  }
  button:hover{border-color:var(--ui-accent); color:var(--ui-accent)}
  button.primary{background:var(--ui-accent); border-color:var(--ui-accent); color:#fff}
  button.primary:hover{opacity:.88; color:#fff}
  .hint{font-size:12px; opacity:.65; padding:10px 16px 0}
  #stage{position:relative; max-width:1200px; margin:8px auto 0; padding:0 12px 12px}
  svg#pad{width:100%; height:auto; display:block; border-radius:12px;
          box-shadow:0 2px 14px rgba(0,0,0,.10)}
  #editor{
    position:absolute; display:none; z-index:30; resize:none; overflow:hidden;
    border:2px solid var(--ui-accent); border-radius:8px; outline:none;
    background:var(--ui-card); color:var(--ui-fg); padding:6px 8px; line-height:1.35;
    font-family:inherit; box-shadow:0 4px 18px rgba(0,0,0,.18);
  }
  details{max-width:1200px; margin:0 auto 40px; padding:0 12px}
  summary{cursor:pointer; font-size:13px; padding:8px 0; opacity:.8}
  textarea#bulk{
    width:100%; height:230px; font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px; line-height:1.6; padding:10px; border-radius:8px;
    border:1px solid var(--ui-line); background:var(--ui-card); color:var(--ui-fg);
  }
  .row{display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap}
  .row small{opacity:.6; font-size:12px}
</style>
</head>
<body>

<div class="bar">
  <h1>PS2コントローラー 操作割当シート</h1>
  <button id="btnPng" class="primary">PNGで保存</button>
  <button id="btnTheme">配色切替</button>
  <button id="btnSample">サンプル入力</button>
  <button id="btnClear">全消去</button>
  <span class="sp"></span>
  <small style="opacity:.6;font-size:12px">枠をクリック → 入力 / Enterで確定・Tabで次へ</small>
</div>

<div class="hint">図の中のタイトル・各ボタンの枠をクリックすると、そのまま書き込めます。</div>

<div id="stage">
<svg id="pad" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="PS2コントローラー操作割当図">
<style>
  #pad{
    --bg:#ffffff; --ink:#1b2230; --sub:#7b8598; --line:#aab3c4;
    --body:#f1f3f8; --body2:#e3e7f0; --btn:#e7ebf3; --btn2:#d5dbe7;
    --accent:#2f6fed; --box:#fbfcfe; --boxline:#d5dbe7; --chip:#e9eefb; --hl:#2f6fed;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;
  }
  #pad.dark{
    --bg:#12141b; --ink:#e8ebf2; --sub:#8d97ab; --line:#4a5468;
    --body:#232936; --body2:#1b2029; --btn:#2d3441; --btn2:#3a4353;
    --accent:#6ea0ff; --box:#1a1e27; --boxline:#333c4d; --chip:#26304a; --hl:#6ea0ff;
  }
  .bg{fill:var(--bg)}
  .body{fill:var(--body); stroke:var(--line); stroke-width:2.5}
  .plate{fill:var(--body2); stroke:none; opacity:.55}
  .btn{fill:var(--btn); stroke:var(--line); stroke-width:2}
  .glyph{fill:none; stroke:var(--sub); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
  .glyphf{fill:var(--sub); stroke:none}
  .ring{fill:var(--btn2); stroke:var(--line); stroke-width:2}
  .cap{fill:var(--btn); stroke:var(--line); stroke-width:2}
  .lead{fill:none; stroke:var(--line); stroke-width:1.6; opacity:.85}
  .dot{fill:var(--line)}
  .box{fill:var(--box); stroke:var(--boxline); stroke-width:1.6}
  .box.filled{stroke:var(--accent); stroke-width:1.8}
  .chip{fill:var(--chip); stroke:none}
  .chipT{fill:var(--accent); font-size:16px; font-weight:700; text-anchor:middle; dominant-baseline:central}
  .nameT{fill:var(--sub); font-size:11px}
  .valT{fill:var(--ink); font-size:16px}
  .valT.empty{fill:var(--sub); font-size:14px; opacity:.65}
  .ttl{fill:var(--ink); font-size:27px; font-weight:700; text-anchor:middle}
  .ttl.empty{fill:var(--sub); opacity:.55}
  .sub{fill:var(--sub); font-size:13px; text-anchor:middle}
  .foot{fill:var(--sub); font-size:11px; text-anchor:middle; opacity:.75}
  .hit{fill:transparent}
  .hitbox{fill:transparent; cursor:pointer}
  .on{stroke:var(--hl) !important; stroke-width:3.4 !important}
  .hit.on{fill:var(--hl); fill-opacity:.22; stroke:none !important}
  .box.on{stroke:var(--hl) !important; stroke-width:2.4 !important}
</style>

<rect class="bg" x="0" y="0" width="1200" height="720"/>

<!-- title -->
<text id="ttlText" class="ttl" x="600" y="46">コントローラー操作割当</text>
<text id="subText" class="sub" x="600" y="74">サブタイトル</text>

<g id="art">
  <!-- shoulder buttons (behind body) -->
  <rect id="b-l2" class="btn" x="418" y="236" width="72" height="28" rx="12"/>
  <rect id="b-r2" class="btn" x="710" y="236" width="72" height="28" rx="12"/>
  <rect id="b-l1" class="btn" x="410" y="262" width="82" height="34" rx="13"/>
  <rect id="b-r1" class="btn" x="708" y="262" width="82" height="34" rx="13"/>

  <!-- body -->
  <path class="body" d="M 470 296 L 730 296
    C 768 296 798 306 806 336
    C 814 366 812 398 802 428
    C 788 472 776 520 762 556
    C 752 582 728 596 704 586
    C 680 574 664 548 654 520
    C 646 500 628 516 600 516
    C 572 516 554 500 546 520
    C 536 548 520 574 496 586
    C 472 596 448 582 438 556
    C 424 520 412 472 398 428
    C 388 398 386 366 394 336
    C 402 306 432 296 470 296 Z"/>
  <ellipse class="plate" cx="600" cy="372" rx="150" ry="62"/>

  <!-- D-pad -->
  <path class="btn" d="M 459 350 h22 v19 h19 v22 h-19 v19 h-22 v-19 h-19 v-22 h19 z"/>
  <path class="glyphf" d="M470 355 l5.5 8 h-11 z"/>
  <path class="glyphf" d="M470 405 l5.5 -8 h-11 z"/>
  <path class="glyphf" d="M445 380 l8 -5.5 v11 z"/>
  <path class="glyphf" d="M495 380 l-8 -5.5 v11 z"/>
  <rect id="d-up"    class="hit" x="459" y="350" width="22" height="20"/>
  <rect id="d-down"  class="hit" x="459" y="390" width="22" height="20"/>

  <rect id="d-right" class="hit" x="480" y="369" width="20" height="22"/>

  <!-- face buttons -->
  <circle id="f-tri" class="btn" cx="730" cy="346" r="17"/>
  <circle id="f-cir" class="btn" cx="764" cy="380" r="17"/>

  <!-- select / start / analog -->
  <rect id="b-sel" class="btn" x="534" y="344" width="44" height="16" rx="8"/>

  <!-- analog sticks -->
  <circle id="s-l" class="ring" cx="543" cy="470" r="34"/>
  <circle class="cap" cx="543" cy="470" r="23"/>
  <circle class="glyph" cx="543" cy="470" r="12"/>
  <circle id="s-r" class="ring" cx="657" cy="470" r="34"/>
  <circle class="cap" cx="657" cy="470" r="23"/>
  <circle class="glyph" cx="657" cy="470" r="12"/>
</g>

<g id="leads"></g>
<g id="labels"></g>

<text class="foot" x="600" y="706">PlayStation 2 / DUALSHOCK 2 レイアウト</text>
</svg>

<textarea id="editor" rows="2" spellcheck="false"></textarea>
</div>

<details>
  <summary>テキストで一括入力／コピー（バックアップ用）</summary>
  <textarea id="bulk" spellcheck="false"></textarea>
  <div class="row">
    <button id="btnApply">テキストを図に反映</button>
    <button id="btnCopy">クリップボードにコピー</button>
    <small>「キー: 割り当て」の形式です。コピーしておけば、次に開いたときに貼り付けて復元できます。</small>
  </div>
</details>

<script>
(function(){
"use strict";

var svg = document.getElementById('pad');
var stage = document.getElementById('stage');
var editor = document.getElementById('editor');
var gLeads = document.getElementById('leads');
var gLabels = document.getElementById('labels');

/* ---------- layout constants ---------- */
var COL_W = 300, COL_H = 70, ROW_TOP = 60, ROW_PITCH = 78;
var LX = 10, RX = 890;
var CEN_W = 160, CEN_Y = 100;

function leftBox(i){  return {x:LX, y:ROW_TOP + i*ROW_PITCH, w:COL_W, h:COL_H}; }
function rightBox(i){ return {x:RX, y:ROW_TOP + i*ROW_PITCH, w:COL_W, h:COL_H}; }

/* ---------- controls ---------- */
var CONTROLS = [
  /* left column */
  {key:'L2',   name:'L2ボタン',            b:leftBox(0), chip:'L2', a:[440,244], dir:'L', t:'#b-l2'},
  {key:'L1',   name:'L1ボタン',            b:leftBox(1), chip:'L1', a:[428,279], dir:'L', t:'#b-l1'},
  {key:'↑',    name:'十字キー 上',          b:leftBox(2), chip:'↑',  a:[463,352], dir:'L', t:'#d-up'},
  {key:'←',    name:'十字キー 左',          b:leftBox(3), chip:'←',  a:[442,380], dir:'L', t:'#d-left'},
  {key:'→',    name:'十字キー 右',          b:leftBox(4), chip:'→',  a:[498,380], dir:'L', t:'#d-right'},
  {key:'↓',    name:'十字キー 下',          b:leftBox(5), chip:'↓',  a:[463,408], dir:'L', t:'#d-down'},
  {key:'Lスティック', name:'左スティック（傾け）', b:leftBox(6), chip:'LS', a:[518,452], dir:'L', t:'#s-l'},
  {key:'L3',   name:'左スティック 押し込み',  b:leftBox(7), chip:'L3', a:[524,494], dir:'L', t:'#s-l'},
  /* right column */
  {key:'R2',   name:'R2ボタン',            b:rightBox(0), chip:'R2', a:[760,244], dir:'R', t:'#b-r2'},
  {key:'R1',   name:'R1ボタン',            b:rightBox(1), chip:'R1', a:[772,279], dir:'R', t:'#b-r1'},
  {key:'△',    name:'△ボタン',             b:rightBox(2), chip:'△',  a:[740,334], dir:'R', t:'#f-tri'},
  {key:'○',    name:'○ボタン',             b:rightBox(3), chip:'○',  a:[780,374], dir:'R', t:'#f-cir'},
  {key:'□',    name:'□ボタン',             b:rightBox(4), chip:'□',  a:[696,398], dir:'R', t:'#f-squ',
                path:'M 890 407 C 800 478 706 470 694 400'},
  {key:'×',    name:'×ボタン',             b:rightBox(5), chip:'×',  a:[742,426], dir:'R', t:'#f-cro'},
  {key:'Rスティック', name:'右スティック（傾け）', b:rightBox(6), chip:'RS', a:[682,452], dir:'R', t:'#s-r'},
  {key:'R3',   name:'右スティック 押し込み',  b:rightBox(7), chip:'R3', a:[676,494], dir:'R', t:'#s-r'},
  /* center top */
  {key:'SELECT', name:'SELECTボタン', b:{x:352,y:CEN_Y,w:CEN_W,h:COL_H}, chip:'SEL', a:[544,346], dir:'VR', t:'#b-sel'},
  {key:'ANALOG', name:'ANALOGボタン', b:{x:520,y:CEN_Y,w:CEN_W,h:COL_H}, chip:'AN',  a:[600,382], dir:'V',  t:'#b-ana'},
  {key:'START',  name:'STARTボタン',  b:{x:688,y:CEN_Y,w:CEN_W,h:COL_H}, chip:'ST',  a:[656,346], dir:'VL', t:'#b-sta'}
];

var TITLE = {key:'__title__'}, SUBTITLE = {key:'__sub__'};

var state = { '__title__':'コントローラー操作割当', '__sub__':'' };

/* ---------- text measuring / wrapping ---------- */
var mc = document.createElement('canvas').getContext('2d');
function measure(txt, px, bold){
  mc.font = (bold?'700 ':'') + px + 'px "Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
  return mc.measureText(txt).width;
}
function wrap(txt, px, maxW, maxLines){
  var lines = [], cur = '';
  for (var i=0;i<txt.length;i++){
    var ch = txt[i];
    if (ch === '\n'){ lines.push(cur); cur=''; if(lines.length>=maxLines) break; continue; }
    if (measure(cur+ch, px) > maxW && cur !== ''){
      lines.push(cur); cur = ch;
      if (lines.length >= maxLines) break;
    } else { cur += ch; }
  }
  if (lines.length < maxLines) lines.push(cur);
  lines = lines.slice(0, maxLines);
  // ellipsis if overflow
  var consumed = lines.join('').length;
  var plain = txt.replace(/\n/g,'');
  if (consumed < plain.length){
    var last = lines[lines.length-1];
    while (last.length && measure(last+'…', px) > maxW) last = last.slice(0,-1);
    lines[lines.length-1] = last + '…';
  }
  return lines.filter(function(l,i){ return l !== '' || i===0; });
}

/* ---------- svg helpers ---------- */
var NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  var n = document.createElementNS(NS, tag);
  for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  return n;
}

/* ---------- build labels ---------- */
CONTROLS.forEach(function(c, idx){
  var b = c.b;
  var ax = c.a[0], ay = c.a[1];
  var bx, by = b.y + b.h/2, c1, c2, d;
  if (c.dir === 'L'){ bx = b.x + b.w; }
  else if (c.dir === 'R'){ bx = b.x; }
  else if (c.dir === 'VL'){ bx = b.x; }
  else if (c.dir === 'VR'){ bx = b.x + b.w; }
  else { bx = b.x + b.w/2; by = b.y + b.h; }

  if (c.dir === 'V'){
    c1 = [bx, by + (ay-by)*0.55];
    c2 = [ax, by + (ay-by)*0.45];
  } else if (c.dir === 'VL' || c.dir === 'VR'){
    c1 = [bx + (c.dir === 'VL' ? -46 : 46), by];
    c2 = [ax, by + (ay-by)*0.55];
  } else {
    c1 = [bx + (ax-bx)*0.55, by];
    c2 = [bx + (ax-bx)*0.45, ay];
  }
  d = c.path || ('M '+bx+' '+by+' C '+c1[0]+' '+c1[1]+' '+c2[0]+' '+c2[1]+' '+ax+' '+ay);
  gLeads.appendChild(el('path', {'class':'lead', d:d}));
  gLeads.appendChild(el('circle', {'class':'dot', cx:ax, cy:ay, r:3}));

  var g = el('g', {'data-key': c.key});
  var rect = el('rect', {'class':'box', x:b.x, y:b.y, width:b.w, height:b.h, rx:11});
  g.appendChild(rect);

  var vert = (c.dir === 'V' || c.dir === 'VL' || c.dir === 'VR');
  var chipW = c.chip.length > 2 ? 46 : 38;
  var tx, vt, nt, ct;
  if (vert){
    chipW = 40;
    g.appendChild(el('rect', {'class':'chip', x:b.x+11, y:b.y+8, width:chipW, height:24, rx:7}));
    ct = el('text', {'class':'chipT', x:b.x+11+chipW/2, y:b.y+21, style:'font-size:13px'});
    ct.textContent = c.chip;
    g.appendChild(ct);
    nt = el('text', {'class':'nameT', x:b.x+11+chipW+9, y:b.y+24});
    nt.textContent = c.name;
    g.appendChild(nt);
    tx = b.x + 13;
    vt = el('text', {'class':'valT', x:tx, y:b.y+50});
    g.appendChild(vt);
    c._y1 = b.y+50; c._y2 = b.y+44;
  } else {
    g.appendChild(el('rect', {'class':'chip', x:b.x+11, y:b.y+(b.h-32)/2, width:chipW, height:32, rx:8}));
    ct = el('text', {'class':'chipT', x:b.x+11+chipW/2, y:b.y+b.h/2+1});
    ct.textContent = c.chip;
    g.appendChild(ct);
    tx = b.x + 11 + chipW + 12;
    nt = el('text', {'class':'nameT', x:tx, y:b.y+22});
    nt.textContent = c.name;
    g.appendChild(nt);
    vt = el('text', {'class':'valT', x:tx, y:b.y+44});
    g.appendChild(vt);
    c._y1 = b.y+45; c._y2 = b.y+38;
  }

  var hit = el('rect', {'class':'hitbox', x:b.x, y:b.y, width:b.w, height:b.h, rx:11});
  g.appendChild(hit);

  c._rect = rect; c._val = vt; c._textX = tx;
  c._textW = b.x + b.w - (vert ? 13 : 14) - tx; c._i = idx;

  hit.addEventListener('click', function(){ startEdit(c); });
  hit.addEventListener('mouseenter', function(){ hl(c, true); });
  hit.addEventListener('mouseleave', function(){ hl(c, false); });

  gLabels.appendChild(g);

  // clicking the control on the pad focuses its box
  var target = svg.querySelector(c.t);
  if (target){
    target.style.cursor = 'pointer';
    target.addEventListener('click', function(){ startEdit(c); });
  }
});

function hl(c, on){
  var t = svg.querySelector(c.t);
  if (t) t.classList.toggle('on', on);
  c._rect.classList.toggle('on', on);
}
function clearHl(){
  Array.prototype.forEach.call(svg.querySelectorAll('.on'), function(n){ n.classList.remove('on'); });
}

/* title / subtitle clickable */
var ttlText = document.getElementById('ttlText');
var subText = document.getElementById('subText');
ttlText.style.cursor = 'pointer';
subText.style.cursor = 'pointer';
ttlText.addEventListener('click', function(){ startEdit(TITLE); });
subText.addEventListener('click', function(){ startEdit(SUBTITLE); });

/* ---------- render ---------- */
function render(){
  CONTROLS.forEach(function(c){
    var v = (state[c.key] || '').trim();
    var t = c._val;
    while (t.firstChild) t.removeChild(t.firstChild);
    t.setAttribute('class', v ? 'valT' : 'valT empty');
    c._rect.classList.toggle('filled', !!v);
    var lines = v ? wrap(v, 16, c._textW, 2) : ['（未設定）'];
    var y0 = lines.length > 1 ? c._y2 : c._y1;
    lines.forEach(function(ln, i){
      var ts = el('tspan', {x:c._textX, y: y0 + i*19});
      ts.textContent = ln;
      t.appendChild(ts);
    });
  });
  var tv = (state['__title__']||'').trim();
  ttlText.textContent = tv || 'タイトルを入力';
  ttlText.setAttribute('class', tv ? 'ttl' : 'ttl empty');
  var sv = (state['__sub__']||'').trim();
  subText.textContent = sv || '（サブタイトル）';
  subText.setAttribute('class', 'sub');
  subText.style.opacity = sv ? 1 : .45;
  syncBulk();
}

/* ---------- inline editing ---------- */
var editing = null;
function startEdit(c){
  commit();
  editing = c;
  var box, fs;
  if (c === TITLE){ box = ttlText.getBoundingClientRect(); fs = 24; }
  else if (c === SUBTITLE){ box = subText.getBoundingClientRect(); fs = 14; }
  else { box = c._rect.getBoundingClientRect(); fs = 15; }
  var host = stage.getBoundingClientRect();
  var pad = 0;
  var left = box.left - host.left, top = box.top - host.top, w = box.width, h = box.height;
  if (c === TITLE || c === SUBTITLE){ left = host.width*0.25; w = host.width*0.5; h = Math.max(h, 40); top -= 6; }
  editor.style.display = 'block';
  editor.style.left = (left + pad) + 'px';
  editor.style.top  = (top + pad) + 'px';
  editor.style.width = (w - pad*2) + 'px';
  editor.style.height = (h - pad*2) + 'px';
  editor.style.fontSize = fs + 'px';
  editor.style.textAlign = (c === TITLE || c === SUBTITLE) ? 'center' : 'left';
  editor.placeholder = (c === TITLE) ? 'タイトル' : (c === SUBTITLE) ? 'サブタイトル' : (c.name + ' に割り当てる操作');
  editor.value = state[c.key] || '';
  editor.focus();
  editor.select();
  if (c.t) hl(c, true);
}
function commit(){
  if (!editing) return;
  state[editing.key] = editor.value.replace(/\s+$/,'');
  if (editing.t) hl(editing, false);
  editing = null;
  editor.style.display = 'none';
  editor.value = '';
  render();
}
function cancel(){
  if (!editing) return;
  if (editing.t) hl(editing, false);
  editing = null;
  editor.style.display = 'none';
  editor.value = '';
}
editor.addEventListener('blur', commit);
editor.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commit(); }
  else if (e.key === 'Escape'){ e.preventDefault(); cancel(); }
  else if (e.key === 'Tab'){
    e.preventDefault();
    var cur = editing;
    var next;
    if (cur === TITLE) next = SUBTITLE;
    else if (cur === SUBTITLE) next = CONTROLS[0];
    else next = CONTROLS[(cur._i + (e.shiftKey ? CONTROLS.length-1 : 1)) % CONTROLS.length];
    commit();
    startEdit(next);
  }
});

/* ---------- bulk text ---------- */
var bulk = document.getElementById('bulk');
function syncBulk(){
  if (document.activeElement === bulk) return;
  var out = ['# タイトル: ' + (state['__title__']||''), '# サブタイトル: ' + (state['__sub__']||''), ''];
  CONTROLS.forEach(function(c){ out.push(c.key + ': ' + (state[c.key]||'')); });
  bulk.value = out.join('\n');
}
document.getElementById('btnApply').addEventListener('click', function(){
  var map = {};
  CONTROLS.forEach(function(c){ map[c.key] = c; });
  bulk.value.split('\n').forEach(function(line){
    var m = line.match(/^\s*(?:#\s*)?([^:：]+)[:：](.*)$/);
    if (!m) return;
    var k = m[1].trim(), v = m[2].trim();
    if (k === 'タイトル') state['__title__'] = v;
    else if (k === 'サブタイトル') state['__sub__'] = v;
    else if (map[k]) state[k] = v;
  });
  render();
});
document.getElementById('btnCopy').addEventListener('click', function(){
  bulk.select();
  try { document.execCommand('copy'); } catch(err){}
  if (navigator.clipboard) navigator.clipboard.writeText(bulk.value).catch(function(){});
  var b = this, o = b.textContent; b.textContent = 'コピーしました'; setTimeout(function(){ b.textContent = o; }, 1200);
});

/* ---------- toolbar ---------- */
document.getElementById('btnClear').addEventListener('click', function(){
  if (!confirm('入力内容をすべて消去します。よろしいですか？')) return;
  CONTROLS.forEach(function(c){ state[c.key] = ''; });
  render();
});
document.getElementById('btnSample').addEventListener('click', function(){
  var s = {
    '△':'メニューを開く','○':'決定 / 実行','×':'キャンセル / 戻る','□':'モード切替',
    '↑':'カーソル上','↓':'カーソル下','←':'前の項目','→':'次の項目',
    'L1':'ズームアウト','R1':'ズームイン','L2':'低速モード','R2':'高速モード',
    'Lスティック':'本体の移動（前後左右）','Rスティック':'カメラ回転','L3':'原点に戻す','R3':'視点リセット',
    'SELECT':'設定画面','START':'一時停止 / 再開','ANALOG':'アナログ切替'
  };
  for (var k in s) state[k] = s[k];
  state['__title__'] = state['__title__'] || 'コントローラー操作割当';
  state['__sub__'] = state['__sub__'] || '2026-07-27  作成者：';
  render();
});
document.getElementById('btnTheme').addEventListener('click', function(){
  var dark = document.documentElement.getAttribute('data-ui') === 'dark';
  document.documentElement.setAttribute('data-ui', dark ? 'light' : 'dark');
  svg.classList.toggle('dark', !dark);
});

/* ---------- PNG export ---------- */
document.getElementById('btnPng').addEventListener('click', function(){
  commit(); clearHl();
  var scale = 2, W = 1200, H = 720;
  var clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', NS);
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);
  Array.prototype.forEach.call(clone.querySelectorAll('.hitbox,.hit'), function(n){ n.parentNode.removeChild(n); });
  var src = new XMLSerializer().serializeToString(clone);
  var blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + src], {type:'image/svg+xml;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function(){
    var cv = document.createElement('canvas');
    cv.width = W*scale; cv.height = H*scale;
    var ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(function(b){
      var a = document.createElement('a');
      var name = (state['__title__']||'ps2-keymap').replace(/[\\/:*?"<>|\s]+/g,'_');
      a.href = URL.createObjectURL(b);
      a.download = name + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    }, 'image/png');
  };
  img.onerror = function(){ alert('PNGの書き出しに失敗しました。'); URL.revokeObjectURL(url); };
  img.src = url;
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') cancel();
});
window.addEventListener('resize', function(){ if (editing){ var c = editing; cancel(); startEdit(c); } });

render();
})();
</script>
