const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const groups = {};
for (const area in colors) groups[area] = L.layerGroup().addTo(map);

const bounds = [];
const counters = {};
places.forEach(p => {
  if (p.lat == null) return;
  counters[p.area] = (counters[p.area]||0)+1;
  const n = counters[p.area];
  const color = colors[p.area] || '#666';
  const icon = L.divIcon({
    className:'',
    html:`<div class="pin-num" style="background:${color}"><span>${n}</span></div>`,
    iconSize:[24,24], iconAnchor:[12,24], popupAnchor:[0,-22]
  });
  const m = L.marker([p.lat,p.lng],{icon});
  m.bindPopup(`<b>${p.area}-${n} ${p.name}</b><br>${p.addr}` +
              (p.matched?`<br><span style="color:#888;font-size:11px">[${p.matched}]</span>`:'') +
              `<br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank">Googleマップで開く</a>`);

  m.addTo(groups[p.area]);
  bounds.push([p.lat,p.lng]);
});

map.fitBounds(bounds,{padding:[40,40]});

for (const area in colors) overlays[`<span style="color:${colors[area]}">●</span> ${area}`] = groups[area];
