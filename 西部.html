const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

const groups={};
for (const p in colors) groups[p]=L.layerGroup().addTo(map);
const bounds=[]; const counters={};
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

markers.forEach(m=>{
  counters[m.pref]=(counters[m.pref]||0)+1;
  const num=counters[m.pref];

    html:`<div class="pin-num" style="background:${color}"><span>${num}</span></div>`,
    iconSize:[24,24],iconAnchor:[12,24],popupAnchor:[0,-22]});
  let body=`<div class="pop-h">${esc(m.label)}</div>`;
  const addrs=[...new Set(m.entries.map(e=>e.addr).filter(Boolean))];
  body+=`<div class="pop-addr">${esc(addrs.join(' / '))}</div>`;
  m.entries.forEach(e=>{
    let line='<div class="pop-e">';

  mk.addTo(groups[m.pref]); bounds.push([m.lat,m.lng]);
});
map.fitBounds(bounds,{padding:[40,40]});

const overlays={};
for(const p in colors) overlays[`<span style="color:${colors[p]}">●</span> ${p}`]=groups[p];
L.control.layers(null,overlays,{collapsed:false}).addTo(map);
const legend=L.control({position:'bottomright'});
legend.onAdd=function(){const d=L.DomUtil.create('div','legend');
  d.innerHTML=`<div style="font-weight:bold;margin-bottom:4px">都県別凡例</div><div class="leg-row"><span class="dot" style="background:#1565c0"></span>東京都 (14件)</div>
<div class="leg-row"><span class="dot" style="background:#e65100"></span>埼玉県 (16件)</div>
`;return d;};
legend.addTo(map);
</script>
</body>
</html>
